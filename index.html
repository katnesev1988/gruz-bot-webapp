<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gruz Bot</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 20px; color: #8e8e93">
      Загрузка...
    </p>

    <script>
      // Роутер мини-приложения.
      // Смотрит на параметр startapp в адресе и перенаправляет
      // пользователя на нужную страницу.
      //
      // Примеры:
      //   ?startapp=create       → create.html (создание заявки)
      //   ?startapp=my_requests  → my_requests.html (мои заявки)
      //   без параметра          → create.html (по умолчанию)

      // Как получить параметр из URL:
      //   1. Если мини-приложение открыто через MAX — параметр в window.WebApp.initDataUnsafe.start_param
      //   2. Если открыто в браузере — параметр в обычных GET-параметрах URL
      let page = "create";

      // Пытаемся взять из MAX
      if (window.WebApp && window.WebApp.initDataUnsafe) {
        const startParam = window.WebApp.initDataUnsafe.start_param;
        if (startParam) {
          page = startParam;
        }
      }

      // Если не получилось (например, страница открыта в браузере напрямую) —
      // пробуем взять из обычных параметров URL
      if (page === "create") {
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get("startapp");
        if (urlParam) {
          page = urlParam;
        }
      }

      // Карта: какой параметр — какая страница.
      const ROUTES = {
        create: "create2.html",
        my_requests: "my_requests.html",
        taken: "taken.html",
        templates: "templates.html",
      };

      // Если параметр неизвестен — идём на create.html по умолчанию.
      const target = ROUTES[page] || ROUTES["create"];
      // Добавляем случайный параметр ?v=... — так MAX и браузер
      // не возьмут старую версию страницы из кэша.
      window.location.replace(target + "?v=" + Date.now());
    </script>
  </body>
</html>
